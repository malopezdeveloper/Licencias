name: Validar y compilar cliente Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Instalar dependencias del servidor
        run: python -m pip install -r requirements.txt
      - name: Probar servidor, HTTPS, interfaz y cliente
        run: python -m unittest discover -s tests -v
      - name: Compilar cliente USB
        run: python app_usb/compilar.py
      - name: Guardar EXE y configuración de ejemplo
        uses: actions/upload-artifact@v4
        with:
          name: PULSIA_Cliente_Licencias_Windows_x64
          path: app_usb/salida/*
          if-no-files-found: error
